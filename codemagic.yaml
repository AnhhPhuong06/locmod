workflows:
  ios-unsigned-ipa:
    name: Build iOS Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        APP_NAME: "NRO_AllStars_unsigned"

    scripts:
      - name: Pull Git LFS objects
        script: |
          git lfs pull || true

      - name: Set permissions for scripts and il2cpp binaries
        script: |
          chmod +x *.sh 2>/dev/null || true
          chmod -R +x Il2CppOutputProject/ 2>/dev/null || true

      - name: Disable Code Signing in Xcode Project
        script: |
          echo "Disabling code signing in $XCODE_PROJECT/project.pbxproj..."
          # Tắt hoàn toàn yêu cầu code signing & development team
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' \
            -e 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "iPhone Developer";/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "";/g' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/PROVISIONING_PROFILE = [^;]*;/PROVISIONING_PROFILE = "";/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            "$XCODE_PROJECT/project.pbxproj"

      - name: Build Xcode Archive (Unsigned)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean archive

      - name: Package Unsigned IPA
        script: |
          echo "Locating built .app bundle inside xcarchive..."
          APP_PATH=$(find "$CM_BUILD_DIR/build.xcarchive/Products/Applications" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$CM_BUILD_DIR/build.xcarchive" -name "*.app" | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not locate .app file!"
            exit 1
          fi

          echo "Found .app at: $APP_PATH"

          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"
          zip -r -y "${APP_NAME}.ipa" Payload/
          echo "Successfully created IPA: $CM_BUILD_DIR/${APP_NAME}.ipa"

    artifacts:
      - $CM_BUILD_DIR/*.ipa
